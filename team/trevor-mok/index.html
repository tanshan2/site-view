<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Protected · 受保護頁面</title>
<style>
:root{color-scheme:light;--navy:#0B1F33;--ink-2:#56616D;--line:#D6D2CA;--gold:#A6834F;--mist:#F5F4F1;--bad:#9C3A2A}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--mist);color:var(--navy);font:15px/1.7 'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:400px;background:#fff;border:1px solid #E3E1DC;border-radius:14px;padding:36px 32px;display:grid;gap:18px;box-shadow:0 24px 48px -32px rgba(11,31,51,.35)}
.lock{width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center}
h1{margin:0;font:600 22px/1.35 'Noto Serif SC','Songti SC',serif}
p{margin:0;color:var(--ink-2);font-size:14px}
label{display:grid;gap:6px;font-size:13px;color:var(--ink-2)}
input[type=password]{height:48px;border:1px solid var(--line);border-radius:8px;padding:0 14px;font:inherit;color:var(--navy);width:100%}
input[type=password]:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(11,31,51,.08)}
.rm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.rm input{accent-color:var(--navy);width:16px;height:16px}
button{height:48px;border:0;border-radius:999px;background:var(--navy);color:#fff;font:500 15px inherit;letter-spacing:.04em;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>

var b=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
var KEYNAME='site-key-'+D.salt;
function store(){try{return localStorage.getItem(KEYNAME)||sessionStorage.getItem(KEYNAME)}catch(e){return null}}
function forget(){try{localStorage.removeItem(KEYNAME);sessionStorage.removeItem(KEYNAME)}catch(e){}}
function open(raw){
  return crypto.subtle.importKey('raw',raw,'AES-GCM',true,['decrypt']).then(function(k){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.iv)},k,b(D.ct)).then(function(pt){
      var html=new TextDecoder().decode(pt);
      document.open();document.write(html);document.close();
    });
  });
}
if(!window.crypto||!crypto.subtle){document.getElementById('err').textContent='请使用较新的浏览器打开（需要 HTTPS） · Please use an up-to-date browser over HTTPS';return}
var saved=store();
if(saved){open(b(saved)).catch(function(){forget()})}
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();
  var btn=document.getElementById('go'),err=document.getElementById('err'),pw=document.getElementById('pw').value;
  btn.disabled=true;err.textContent='';
  crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(base){
    return crypto.subtle.deriveBits({name:'PBKDF2',salt:b(D.salt),iterations:D.iter,hash:'SHA-256'},base,256);
  }).then(function(bits){
    var raw=new Uint8Array(bits);
    var keep=document.getElementById('rm').checked;
    return open(raw).then(function(){
      var s=btoa(String.fromCharCode.apply(null,raw));
      try{(keep?localStorage:sessionStorage).setItem(KEYNAME,s)}catch(x){}
    });
  }).catch(function(){
    btn.disabled=false;err.textContent='密码不正确 · 密碼不正確 · Incorrect password';
    var i=document.getElementById('pw');i.select();i.focus();
  });
});
})();
